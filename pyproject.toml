[project]
name = "mochi-agents"
version = "0.1.0"
description = "A modular, multi-agent service bot with per-agent memory and model specialization."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ytlee"},
]
keywords = ["agents", "multi-agent", "telegram", "bot", "gemini", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "croniter>=1.0",
    "mcp[cli]>=1.0",
    "watchdog>=4.0.0",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/ytlee/mochi"
Repository = "https://github.com/ytlee/mochi"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mochi-agents = "mochi_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mochi_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
